rules:

  - id: no-underscore-prefix-function
    patterns:
      - pattern: |
          def $FUNC(...):
              ...
      - metavariable-regex:
          metavariable: $FUNC
          # Matches single-underscore prefix; excludes dunder (__init__ etc.)
          regex: "^_[^_]"
    message: |
      Function `$FUNC` uses a single-underscore prefix to signal private scope.
      Restructure code or use explicit module boundaries instead of underscore
      conventions. Suppress with `# nosemgrep: no-underscore-prefix-function`.
    languages: [python]
    severity: ERROR

  - id: no-underscore-prefix-variable
    patterns:
      - pattern: $VAR = ...
      - metavariable-regex:
          metavariable: $VAR
          regex: "^_[^_]"
    message: |
      Variable `$VAR` uses a single-underscore prefix. Avoid using underscore-prefixed
      names to signal private scope. Suppress with `# nosemgrep: no-underscore-prefix-variable`.
    languages: [python]
    severity: ERROR
